[project]
name = "tamtam-agent"
version = "0.1.0"
description = "Agent de priorisation du TAM Mirakl à partir des exports Tamtam"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
gemini = ["google-genai>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tamtam-agent = "tamtam_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
